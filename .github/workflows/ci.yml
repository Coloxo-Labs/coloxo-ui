name: CI
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install
      - run: pnpm registry:build
      - run: pnpm registry:validate
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:cli
      - run: pnpm pack:check
