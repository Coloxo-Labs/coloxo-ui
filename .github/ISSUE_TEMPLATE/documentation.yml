name: Documentation
description: Fix or improve docs, COMPONENTS.md, examples, or getting-started copy.
title: "[docs]: "
labels: ["documentation", "triage"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Documentation type
      options:
        - Getting started / install
        - Component docs (props, usage, a11y)
        - COMPONENTS.md
        - Dual-style / CLI install instructions
        - Theming / tokens
        - Examples / site copy
        - CONTRIBUTING / README
        - Other
    validations:
      required: true

  - type: input
    id: location
    attributes:
      label: Where
      description: URL or file path (e.g. `https://ui.coloxolabs.com/components/button` or `COMPONENTS.md`).
      placeholder: /docs/getting-started
    validations:
      required: true

  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true

  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
      description: Proposed wording, structure, or examples.
